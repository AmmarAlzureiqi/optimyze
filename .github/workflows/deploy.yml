name: Deploy to EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'  # Only trigger on backend changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Debug SSH Key Format
      run: |
        echo "Key starts with BEGIN:"
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | head -1 | grep -o "BEGIN" || echo "No BEGIN found"
        echo "Key ends with END:"
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | tail -1 | grep -o "END" || echo "No END found"
        echo "Total lines in key:"
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | wc -l
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 3.98.212.188  # Your EC2 IP
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # Navigate to your Django project on EC2
          cd /opt/airflow/tmp/repo
          
          # Handle any local changes
          git stash || echo "No changes to stash"
          
          # Pull latest changes
          git pull origin main
          
          # Navigate to backend
          cd backend
          
          # Activate virtual environment
          source venv/bin/activate
          
          # Install/update dependencies
          pip install -r requirements.txt
          
          # Run Django management commands
          python manage.py migrate
          python manage.py collectstatic --noinput
          
          # Rebuild search index
          python manage.py build_search_index --verbosity=1
          
          # Restart services
          sudo systemctl restart django
          sudo systemctl restart nginx
          
          # Check service status
          sudo systemctl is-active django
          sudo systemctl is-active nginx
          
          echo "✅ Deployment completed successfully!"
          echo "Services restarted and running"